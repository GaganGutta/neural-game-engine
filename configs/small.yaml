# CPU-trainable config. This is the one the shipped checkpoint was trained with,
# on an 8-core laptop CPU with no GPU. Everything is smaller than the plan calls
# for; see full.yaml for the intended scale.
name: small
seed: 0
amp: false          # bf16 autocast is a loss on this CPU, see docs/BENCHMARKS.md
num_workers: 4
log_every: 100
eval_every: 1500

data:
  root: data/my_way_home
  env: my_way_home
  frames: 150000
  frame_skip: 4
  workers: 6

tokenizer:
  ch: 128
  embed_dim: 64
  num_codes: 512
  n_res: 2
  commit_beta: 0.25
  batch_size: 32
  steps: 12000
  lr: 3.0e-4

# Sized by measurement, not by taste. On this CPU the binding constraint is
# samples seen, not parameters: at a fixed wall-clock budget this config gets
# through 2.2x more windows than d_model=256/context=8, and an undertrained
# model would rather have the data. See docs/BENCHMARKS.md for the machine.
dynamics:
  context: 6          # frames of history the model sees
  d_model: 192
  n_layers: 4
  n_heads: 8
  dropout: 0.0
  # 'rope' lets the KV cache survive a frame boundary and makes longer
  # context affordable. 'absolute' is what the shipped checkpoint used.
  pos_encoding: rope
  batch_size: 16
  steps: 6500
  lr: 6.0e-4          # short schedule, so push the LR harder than the usual 3e-4
  warmup: 300
  # Fraction of steps trained with the MaskGIT objective rather than pure
  # next-frame teacher forcing. Both share one set of weights.
  maskgit_frac: 0.5

infer:
  decode: maskgit     # 'maskgit' (parallel) or 'raster' (autoregressive)
  # 4, not 8: measured in docs/DECODE.md. Past ~4 passes neither PSNR nor
  # sharpness moves on this checkpoint, so the extra latency buys nothing. At
  # full scale the decoder may well become the limiting factor again -- re-run
  # ngx.eval.decode_quality before assuming this number transfers.
  maskgit_steps: 4
  temperature: 1.0
  top_k: 50
  # Cache carrying across frames is an approximation; see docs/CACHE_CADENCE.md.
  carry_cache: false

memory:
  # Off by default, and docs/DRIFT.md explains why: on this CPU-scale checkpoint
  # it moves return-to-place consistency by less than the run-to-run spread.
  # Retrieval finds the right room ~80% of the time; the model is simply too
  # small to use a distant context slot. Toggle it live with M in play.py.
  enabled: false
  capacity: 4096
  k: 2
  # Cosine similarity on mean codebook embeddings. Measured on the reference
  # trajectory: matched revisits average 0.96, random pairs 0.47.
  min_sim: 0.9
  write_every: 4
  exclude_recent: 64   # ignore the last N writes; the recent past is already in context
