[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ngx"
version = "0.1.0"
description = "A playable neural game engine: an action-conditioned world model you drive with a keyboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pygame>=2.5",
    "imageio>=2.31",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "vizdoom>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["ngx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
