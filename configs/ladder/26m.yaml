# Ladder rung: see docs/LADDER_PREREG.md for the rules this run reports against.
name: ladder-26m
seed: 0              # overridden per run: --set seed=N name=<rung>-sN
amp: true
num_workers: 0       # dataset is preloaded into RAM; workers would only add IPC
log_every: 100
eval_every: 1000

data:
  root: data/mwh2m
  env: my_way_home
  frames: 2000000
  frame_skip: 4
  preload: true

# The ladder reuses the tokenizer trained under the 'small' run (all 2M frames
# were tokenized with it; 29.53 dB ceiling, all 512 codes live).
tokenizer_ckpt: checkpoints/small/vqvae.pt

tokenizer:            # architecture record only; weights come from tokenizer_ckpt
  ch: 128
  embed_dim: 64
  num_codes: 512
  n_res: 2

infer:
  decode: maskgit
  maskgit_steps: 4
  temperature: 1.0
  top_k: 50
  carry_cache: false

memory:
  enabled: false

dynamics:
  context: 6
  d_model: 512
  n_layers: 8
  n_heads: 8
  dropout: 0.0
  pos_encoding: rope
  batch_size: 128
  lr: 3.6e-4
  warmup: 1000
  # T* = 4 epochs of the 2M-frame set (tokens = windows x context x 65); the
  # trainer derives the step count from this and plans the cosine over it.
  token_budget: 2916000000
  steps: 80000            # safety cap only; the budget binds first
  checkpoint_every: 2000
